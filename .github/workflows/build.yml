name: CI / CD

# push to main  -> lint, tests on Linux, Windows and macOS (Apple Silicon + Intel), every build smoke-tested,
#                  published as the rolling "nightly" pre-release
# tag v1.2.3    -> the same, then a GitHub release "Island 1.2.3" with notes, binaries and SHA256SUMS
# pull request  -> lint, tests and builds only (binaries as workflow artifacts)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8     # test output is in Russian; Windows runners default to cp1252
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check .
      - name: Byte-compile everything
        run: python -m compileall -q island_app tests main.py build_exe.py
      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' island_app/config.py)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}-nightly.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: lint
    # oldest supported runner = widest glibc compatibility for the binary
    runs-on: ubuntu-22.04
    env:
      ISLAND_VERSION: ${{ needs.lint.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 \
            libzbar0 tesseract-ocr xdotool fonts-noto-core

      - name: Python packages
        run: python -m pip install -r requirements.txt

      - name: Tests
        timeout-minutes: 12
        run: |
          for t in check_tools check_layout check_integrations check_calendar check_notes check_desk check_extras; do
            echo "::group::$t"
            ISLAND_HOME=$(mktemp -d) xvfb-run -a -s "-screen 0 1920x1080x24" python tests/$t.py
            echo "::endgroup::"
          done

      - name: Demo run with screenshots (from source)
        timeout-minutes: 6
        run: |
          export ISLAND_HOME=$(mktemp -d)
          xvfb-run -a -s "-screen 0 1920x1080x24" python main.py --demo --exit --out ci-shots/source
          test "$(ls ci-shots/source | wc -l)" -ge 40

      - name: Build the binary
        run: python build_exe.py

      - name: Test the binary
        timeout-minutes: 6
        run: |
          export ISLAND_HOME=$(mktemp -d)
          xvfb-run -a -s "-screen 0 1920x1080x24" ./Island-linux-x86_64 --demo --exit --out ci-shots/binary
          test "$(ls ci-shots/binary | wc -l)" -ge 40
          test -f "$ISLAND_HOME/data.json"

      - uses: actions/upload-artifact@v4
        with:
          name: Island-linux
          path: Island-linux-x86_64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: ci-shots/
          retention-days: 7

  windows:
    needs: lint
    runs-on: windows-latest
    env:
      ISLAND_VERSION: ${{ needs.lint.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages
        run: python -m pip install -r requirements.txt

      - name: Tests
        timeout-minutes: 12
        shell: pwsh
        run: |
          foreach ($t in "check_tools", "check_layout", "check_integrations", "check_calendar", "check_notes", "check_desk", "check_extras") {
            Write-Output "::group::$t"
            $env:ISLAND_HOME = Join-Path $env:RUNNER_TEMP "island-$t"
            python "tests/$t.py"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Output "::endgroup::"
          }

      - name: Build
        run: python build_exe.py

      - name: Test the binary
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:ISLAND_HOME = Join-Path $env:RUNNER_TEMP "island-exe"
          $out = Join-Path $env:GITHUB_WORKSPACE "ci-shots/binary"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process .\Island.exe -ArgumentList "--demo", "--exit", "--out", $out -PassThru -Wait
          $n = (Get-ChildItem $out).Count
          Write-Output "exit $($p.ExitCode), $n screenshots"
          if ($p.ExitCode -ne 0 -or $n -lt 40) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Island-windows
          path: Island.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: ci-shots/
          retention-days: 7

  macos:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      ISLAND_VERSION: ${{ needs.lint.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System and Python packages
        run: |
          brew install zbar
          python -m pip install -r requirements.txt

      - name: Tests
        timeout-minutes: 15
        run: |
          for t in check_tools check_layout check_integrations check_calendar check_notes check_desk check_extras; do
            echo "::group::$t"
            ISLAND_HOME=$(mktemp -d) python tests/$t.py
            echo "::endgroup::"
          done

      - name: Demo run with screenshots (from source)
        timeout-minutes: 6
        run: |
          export ISLAND_HOME=$(mktemp -d)
          python main.py --demo --exit --out ci-shots/source
          test "$(ls ci-shots/source | wc -l)" -ge 40

      - name: Build Island.app and the .dmg
        run: python build_exe.py

      - name: Test the app
        timeout-minutes: 6
        run: |
          export ISLAND_HOME=$(mktemp -d)
          ./Island.app/Contents/MacOS/Island --demo --exit --out ci-shots/binary
          test "$(ls ci-shots/binary | wc -l)" -ge 40
          test -f "$ISLAND_HOME/data.json"
          codesign --verify --deep --strict Island.app
          hdiutil imageinfo "Island-macos-${{ matrix.arch }}.dmg" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Island-macos-${{ matrix.arch }}
          path: Island-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos-${{ matrix.arch }}
          path: ci-shots/
          retention-days: 7

  publish:
    needs: [lint, linux, windows, macos]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.lint.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Island-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          chmod +x Island-linux-x86_64
          sha256sum Island.exe Island-linux-x86_64 Island-macos-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Island $VERSION"

      - name: Nightly
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" --title "Nightly $VERSION" \
            --notes "Сборка из последнего коммита main ($GITHUB_SHA). Для обычного использования берите последний релиз."
